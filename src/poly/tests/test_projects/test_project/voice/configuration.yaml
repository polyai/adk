greeting:
  welcome_message: Hello! Welcome to our service. Your account shows {{attr:member_status}}. How can
    I assist you today?
  language_code: en-GB
style_prompt:
  prompt: You are a helpful and professional customer service assistant.
disclaimer_messages:
  message: This conversation may be recorded for quality assurance.
  enabled: true
  language_code: en-GB
filler_phrases:
  enabled: true
  phrases:
  - One moment...
  - Just a second...
  randomize: true
  initial_interval_seconds: 2.5
  interval_seconds: 5
background_ambience:
  preset: office-ambiance
  loudness: -50
