api_integrations:
- name: customer_api
  description: test
  environments:
    sandbox:
      base_url: https://dev-customer.com
      auth_type: basic
    pre-release:
      base_url: https://dev-customer.com
      auth_type: basic
    live:
      base_url: https://customer.com
      auth_type: apiKey
  operations:
  - name: create_booking
    method: POST
    resource: /bookings
    request_body_schema:
      type: object
      required:
      - customer_id
      properties:
        customer_id:
          type: string
        notes:
          type: string
          maxLength: 500
      additionalProperties: false
    response_schemas:
      '201':
        type: object
        properties:
          booking_id:
            type: string
      default:
        type: object
        properties:
          error:
            type: string
  - name: get_confirmation_status
    description: Confirmation status of a booking
    method: GET
    resource: /bookings/{booking_id}/confirmation-status
    headers:
      Accept: application/json
    request_query_schema:
      type: object
      properties:
        include_history:
          type: boolean
    schema_source: observed
