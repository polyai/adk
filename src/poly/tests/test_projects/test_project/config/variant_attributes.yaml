variants:
  - name: default
    is_default: true
  - name: spanish
attributes:
  - name: customer_name
    values:
      default: "value-1"
      spanish: "valor-1"
  - name: email_address
    values:
      default: "value-2"
      spanish: "valor-2"
  - name: member_status
    values:
      default: "value-3"
      spanish: "valor-3"
  - name: booking_status
    values:
      default: "value-4"
      spanish: "valor-4"
  - name: max_retries
    kind: number
    values:
      default: 3
      spanish: 5
  - name: serves_alcohol
    kind: boolean
    values:
      default: true
      spanish: false
  - name: tier
    kind: enum
    config:
      values:
        - basic
        - premium
    values:
      default: premium
      spanish: basic
  - name: menu_config
    kind: object
    values:
      default:
        categories:
          - pizza
          - pasta
        currency: USD
      spanish:
        categories:
          - paella
        currency: EUR
