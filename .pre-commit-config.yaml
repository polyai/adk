repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in step with the ruff version uv.lock resolves for pyproject.toml's ruff dependency
    rev: v0.14.2
    hooks:
      # Run the linter (with --fix to auto-fix issues locally)
      - id: ruff-check
        args: [--fix]
      # Run the formatter (auto-fix formatting issues)
      - id: ruff-format