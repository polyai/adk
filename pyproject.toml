[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]
include = [
    "poly*",
]
exclude = [
    "poly.tests*",
]

[tool.setuptools.package-data]
"poly.resources" = [
    "*.yaml",
]
"poly.docs" = [
    "*.md",
]

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = [
    "src/poly/handlers/protobuf/",
]

[tool.ruff.lint]
# Ruff defaults (pycodestyle errors + pyflakes) plus import sorting
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]

[tool.ruff.format]
exclude = [
    "src/poly/tests/**.py",
]

[tool.ruff.lint.per-file-ignores]
"src/poly/handlers/protobuf/**" = [
    "ALL",
]
"*/__init__.py" = [
    "F401",
]
"src/poly/tests/**.py" = [
    "D100",
    "F403",
    "F405",
]

[tool.coverage.run]
omit = [
    "src/poly/handlers/protobuf/*",
    "src/poly/types/*",
]

[tool.coverage.report]
omit = [
    "src/poly/handlers/protobuf/*",
    "src/poly/types/*",
]

[tool.pytest.ini_options]
testpaths = ["src/poly/tests"]
norecursedirs = [
    "test_projects",
]

[tool.pip-licenses]
format = "json"
output-file = "licenses.json"
with-urls = true
no-version = true
ignore-packages = [
    "polyai-adk",
]

[tool.licensecheck]
using = "PEP631"
only_licenses = [
    "mit",
    "apache",
    "bsd",
    "mpl",
]
ignore_packages = [
    "idna",
    "jsonschema",
    "jsonschema-specifications",
    "referencing",
    "rpds-py",
    "urllib3",
    "wcwidth",
    "posthog",
    "typing_extensions",
    # Voice-calling deps + transitives — all permissive (BSD/MIT/Apache/ISC), but
    # licensecheck can't auto-classify their metadata and reports UNKNOWN.
    "aioice",
    "aiortc",
    "av",
    "cffi",
    "cryptography",
    "dnspython",
    "google-crc32c",
    "numpy",
    "pycparser",
    "pylibsrtp",
    "pywebrtc-audio",
    "sounddevice",
    "websockets",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
# Keep skills/*/SKILL.md metadata.version in lockstep with the CLI version.
# Validated in CI by scripts/validate_skills.py.
version_variables = [
    "skills/poly-adk-branching/SKILL.md:version",
    "skills/poly-adk-conversations/SKILL.md:version",
    "skills/poly-adk-rtc/SKILL.md:version",
    "skills/poly-adk-testing/SKILL.md:version",
    "skills/poly-adk-workflow/SKILL.md:version",
]
branch = "main"
commit_message = "chore(release): {version}"
build_command = "pip install build && python -m build"
tag_format = "v{version}"

[tool.semantic_release.changelog]
# templates/.release_notes.md.j2 prepends a "Getting started" block to every
# GitHub release (DEVP-790); CHANGELOG.md generation is unaffected.
template_dir = "templates"












































[project]
name = "polyai-adk"
version = "0.62.0"
description = "Agent Development Kit (ADK) — a CLI for building, testing, and deploying PolyAI voice and chat agents, self-serve"
readme = "README.md"
requires-python = ">=3.14.0"
keywords = [
    "voice-ai",
    "conversational-ai",
    "cli",
    "agent-development-kit",
    "voice-agents",
]
classifiers = [
    "Topic :: Communications :: Telephony",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
dependencies = [
    "protobuf>=4.21.0",
    "rich>=13.0.0",
    "ruamel.yaml>=0.18.0",
    # libyaml-backed parser for YAML loads. Pinned to a version with prebuilt cp314 wheels and
    # limited to the architectures those wheels cover, so installs never need a compiler.
    # Elsewhere ruamel.yaml falls back to its pure-Python parser.
    "ruamel.yaml.clib==0.2.15; platform_python_implementation == 'CPython' and python_version < '3.15' and (platform_machine == 'x86_64' or platform_machine == 'AMD64' or platform_machine == 'arm64' or platform_machine == 'aarch64')",
    "questionary==2.1.1",
    "jsonschema>=4.20.0",
    "requests==2.31.0",
    "python-dateutil==2.8.2",
    "ruff>=0.14.0",
    "ty",
    "argcomplete>=3.0.0",
    "langcodes==3.5.1",
    "posthog==7.35.4",
    "packaging>=24.0",
    # Voice calling (`poly call`): WebRTC transport, audio I/O, and WebRTC APM / AEC3
    # (echo cancellation). Native deps — pinned to versions with confirmed prebuilt
    # cp314 wheels so a future release can't break installs.
    "aiortc==1.15.0",
    "sounddevice==0.5.6",
    "websockets==17.1",
    "numpy==2.5.3",
    "pywebrtc-audio==0.2.0",
]

[project.license]
text = "Apache-2.0"

[project.urls]
Documentation = "https://docs.poly.ai/adk"
Homepage = "https://docs.poly.ai/adk"
Source = "https://github.com/polyai/adk"
Changelog = "https://github.com/polyai/adk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pre-commit>=3.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "coverage>=7.0.0",
    "tomli-w>=1.0.0",
    "pip-licenses>=5.5.1",
    "licensecheck>=2024.3",
]

[project.scripts]
poly = "poly.cli:main"
adk = "poly.cli:main"
